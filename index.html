  <script>
    try {
      const saved = localStorage.getItem('offsets-theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch {
      document.documentElement.dataset.theme = 'dark';
    }

  <style>
    *,

      box-sizing: border-box;

    :root {

      --bg-deep: #05060a;
      --panel: linear-gradient(158deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.018) 46%, rgba(255, 255, 255, 0.008) 100%);
      --panel-hover: linear-gradient(158deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.03) 46%, rgba(255, 255, 255, 0.012) 100%);
      --panel-solid: #101219;
      --stroke: rgba(255, 255, 255, 0.075);
      --stroke-strong: rgba(255, 255, 255, 0.14);
      --stroke-accent: rgba(122, 162, 255, 0.42);
      --sheen: rgba(255, 255, 255, 0.07);
      --accent: #6b93ff;
      --accent-soft: #9bb6ff;
      --accent-dim: rgba(107, 147, 255, 0.16);
      --text: #eef1f8;
      --text-soft: #9aa3b8;
      --text-dim: #5d667c;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 16px -10px rgba(0, 0, 0, 0.9);
      --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.4), 0 24px 48px -28px rgba(0, 0, 0, 1);
      --shadow-lg: 0 40px 90px -40px rgba(0, 0, 0, 1), 0 2px 6px rgba(0, 0, 0, 0.5);
      --glow: 0 0 0 1px rgba(107, 147, 255, 0.28), 0 18px 46px -22px rgba(107, 147, 255, 0.55);
      --radius: 16px;
      --radius-sm: 11px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
      --glow-core: 226, 236, 255;
      --glow-halo: 107, 147, 255;
      --add: #3fb950;
      --del: #f85149;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f2f4f9;
      --bg-deep: #e7ebf4;
      --panel: linear-gradient(158deg, #ffffff 0%, #fbfcfe 100%);
      --panel-hover: linear-gradient(158deg, #ffffff 0%, #f4f7ff 100%);
      --panel-solid: #ffffff;
      --stroke: rgba(15, 23, 42, 0.09);
      --stroke-strong: rgba(15, 23, 42, 0.16);
      --stroke-accent: rgba(37, 99, 235, 0.4);
      --sheen: rgba(255, 255, 255, 0.9);
      --accent: #2f6bff;
      --accent-soft: #1d4ed8;
      --accent-dim: rgba(47, 107, 255, 0.1);
      --text: #0c1222;
      --text-soft: #4d5875;
      --text-dim: #8791a8;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 18px -14px rgba(15, 23, 42, 0.4);
      --shadow-md: 0 1px 3px rgba(15, 23, 42, 0.07), 0 22px 44px -30px rgba(15, 23, 42, 0.5);
      --shadow-lg: 0 40px 80px -40px rgba(15, 23, 42, 0.45), 0 2px 6px rgba(15, 23, 42, 0.08);
      --glow: 0 0 0 1px rgba(47, 107, 255, 0.25), 0 18px 40px -24px rgba(47, 107, 255, 0.45);
      --glow-core: 47, 107, 255;
      --glow-halo: 120, 160, 255;
      color-scheme: light;
    }

    html {
      scroll-behavior: smooth;
      font-size: 95%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9375rem;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    ::selection {
      background: var(--accent-dim);
      color: var(--text);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--stroke-strong);
      border: 3px solid transparent;
      background-clip: padding-box;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 8px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .backdrop::before {
      content: '';
      position: absolute;
      top: -420px;
      left: 50%;
      width: 1100px;
      height: 900px;
      margin-left: -550px;
      background: radial-gradient(circle at 50% 50%, rgba(107, 147, 255, 0.20), transparent 62%);
      filter: blur(30px);
    }

    .backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 70% at 50% 0%, transparent 30%, var(--bg-deep) 100%);
    }

    .backdrop-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--stroke) 1px, transparent 1px),
        linear-gradient(to bottom, var(--stroke) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% -5%, #000 0%, transparent 75%);
      opacity: 0.55;
    }

    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px 96px;
    }

    .float-tools {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 50;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-soft);
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen), var(--shadow-sm);
      backdrop-filter: blur(12px);
      transition: color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--stroke-strong);
      transform: translateY(-1px);
    }

    .icon-btn i {
      font-size: 1.05rem;
    }

    .hero {
      padding: 88px 0 56px;
      text-align: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-soft);
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen), var(--shadow-sm);
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.16);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.16);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.04);
      }
    }

    .hero h1 {
      margin: 24px 0 0;
      font-size: clamp(2.6rem, 7vw, 4.15rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 600;
      background: linear-gradient(178deg, var(--text) 30%, color-mix(in srgb, var(--text) 45%, transparent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(150deg, var(--accent-soft), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 560px;
      margin: 20px auto 0;
      color: var(--text-soft);
      font-size: 1.03rem;
    }

    .hero-meta {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 18px;
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    .hero-meta span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .hero-meta a {
      color: var(--accent-soft);
      transition: opacity .18s ease;
    }

    .hero-meta a:hover {
      opacity: 0.75;
    }

    .searchbar {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      backdrop-filter: blur(2px);
    }

    .searchbar-field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 56px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen), var(--shadow-md);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .searchbar-field:focus-within {
      border-color: var(--stroke-accent);
      box-shadow: inset 0 1px 0 var(--sheen), var(--glow);
    }

    .searchbar-field>i {
      color: var(--text-dim);
      font-size: 1.15rem;
    }

    .searchbar input {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: none;
      border: 0;
      outline: none;
      font-size: 0.97rem;
    }

    .searchbar input::placeholder {
      color: var(--text-dim);
    }

    .searchbar input::-webkit-search-cancel-button {
      display: none;
    }

    .search-count {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      padding: 4px 9px;
      border-radius: 7px;
      border: 1px solid var(--stroke);
    }

    .search-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      z-index: 30;
      max-height: 380px;
      overflow-y: auto;
      padding: 6px;
      border-radius: 14px;
      background: var(--panel-solid);
      border: 1px solid var(--stroke-strong);
      box-shadow: var(--shadow-lg);
    }

    .search-hit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: none;
      text-align: left;
      transition: background .14s ease;
    }

    .search-hit:hover {
      background: var(--accent-dim);
    }

    .search-hit-path {
      display: block;
      font-size: 0.83rem;
      font-weight: 500;
    }

    .search-hit-line {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--text-soft);

      text-overflow: ellipsis;

    }

    .search-hit-badge {

    }

    .search-note {
      padding: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    section {
      margin-top: 72px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-head h2 {
      font-size: 1.32rem;
      font-weight: 600;
      letter-spacing: -0.028em;
    }

    .section-head p {
      margin-top: 5px;
      font-size: 0.89rem;
      color: var(--text-soft);
      max-width: 520px;
    }

    .section-head-aside {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-soft);
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen);
    }

    .rows {
      border-top: 1px solid var(--stroke);
    }

    .row {
      --edge-left: 0;
      --edge-right: 0;
      --edge-top: 0;
      --edge-bottom: 0;
      --edge-x: 50%;
      --edge-y: 50%;
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--stroke);
      transition: background .2s ease;
    }

    .row:hover {
      background: color-mix(in srgb, var(--accent) 2%, transparent);
    }

    .row::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(calc(112px - 106px * var(--edge-left)) calc(72px + 260px * var(--edge-left)) at 0% var(--edge-y),
          rgba(var(--glow-core), calc(var(--edge-left) * 0.62)) 0%,
          rgba(var(--glow-halo), calc(var(--edge-left) * 0.34)) 42%,
          transparent 76%),
        radial-gradient(calc(112px - 106px * var(--edge-right)) calc(72px + 260px * var(--edge-right)) at 100% var(--edge-y),
          rgba(var(--glow-core), calc(var(--edge-right) * 0.62)) 0%,
          rgba(var(--glow-halo), calc(var(--edge-right) * 0.34)) 42%,
          transparent 76%),
        radial-gradient(calc(140px + 400px * var(--edge-top)) calc(58px - 52px * var(--edge-top)) at var(--edge-x) 0%,
          rgba(var(--glow-core), calc(var(--edge-top) * 0.58)) 0%,
          rgba(var(--glow-halo), calc(var(--edge-top) * 0.3)) 42%,
          transparent 78%),
        radial-gradient(calc(140px + 400px * var(--edge-bottom)) calc(58px - 52px * var(--edge-bottom)) at var(--edge-x) 100%,
          rgba(var(--glow-core), calc(var(--edge-bottom) * 0.58)) 0%,
          rgba(var(--glow-halo), calc(var(--edge-bottom) * 0.3)) 42%,
          transparent 78%);
      mask-image: linear-gradient(#000, #000);
    }

    .row::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 1px 0 0 rgba(var(--glow-core), calc(var(--edge-left) * 0.9)),
        inset -1px 0 0 rgba(var(--glow-core), calc(var(--edge-right) * 0.9)),
        inset 0 1px 0 rgba(var(--glow-core), calc(var(--edge-top) * 0.9)),
        inset 0 -1px 0 rgba(var(--glow-core), calc(var(--edge-bottom) * 0.9));
    }

    .row>* {
      position: relative;
      z-index: 1;
    }

    .row-glyph {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--accent-soft);
      font-size: 1.05rem;
      background: var(--accent-dim);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen);
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-name {
      display: block;
      font-family: var(--mono);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .row-desc {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      color: var(--text-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-meta {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 0.71rem;
      color: var(--text-dim);
    }

    .row-arrow {
      flex-shrink: 0;
      color: var(--text-dim);
      font-size: 0.95rem;
      opacity: 0;
      transform: translate(-4px, 4px);
      transition: opacity .2s ease, transform .2s ease, color .2s ease;
    }

    .row:hover .row-arrow {
      opacity: 1;
      transform: none;
      color: var(--accent-soft);
    }

    .row-actions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-soft);
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen);
      transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--stroke-strong);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(170deg, var(--accent-soft), var(--accent));
      border-color: transparent;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 12px 26px -14px var(--accent);
    }

    .btn-primary:hover {
      color: #fff;
      filter: brightness(1.06);
    }

    .btn-grow {
      flex: 1;
    }

    .btn-full {
      width: 100%;
    }

    .select {
      appearance: none;
      cursor: pointer;
      padding: 9px 34px 9px 13px;
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 0.78rem;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen);
      background-image:
        linear-gradient(45deg, transparent 50%, currentColor 50%),
        linear-gradient(135deg, currentColor 50%, transparent 50%),
        var(--panel);
      background-position: right 16px center, right 11px center, 0 0;
      background-size: 5px 5px, 5px 5px, auto;
      background-repeat: no-repeat, no-repeat, no-repeat;
    }

    .select:hover {
      border-color: var(--stroke-strong);
    }

    .select option {
      background: var(--panel-solid);
      color: var(--text);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .revision {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 18px;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: inset 0 1px 0 var(--sheen);
      transition: border-color .2s ease, background .2s ease;
    }

    .revision:hover {
      border-color: var(--stroke-strong);
      background: var(--panel-hover);
    }

    .revision-body {
      min-width: 0;
    }

    .revision-msg {
      font-size: 0.89rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .revision-meta {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-family: var(--mono);
      font-size: 0.71rem;
      color: var(--text-dim);
    }

    .revision-meta a {
      color: var(--accent-soft);
    }

    .revision-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .state {
      padding: 30px;
      text-align: center;
      font-size: 0.87rem;
      color: var(--text-dim);
      border-radius: var(--radius);
      border: 1px dashed var(--stroke-strong);
    }

    .spin {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(3, 4, 8, 0.68);
      backdrop-filter: blur(6px);
      animation: fade .18s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
    }

    .dialog {
      display: flex;
      flex-direction: column;
      width: min(1000px, 100%);

      border-radius: 18px;
      overflow: hidden;
      background: var(--panel-solid);
      border: 1px solid var(--stroke-strong);
      box-shadow: var(--shadow-lg);
      animation: rise .22s cubic-bezier(.22, 1, .36, 1);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--stroke);
      background: var(--panel);
    }

    .dialog-file {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .dialog-file>i {
      color: var(--accent-soft);
      font-size: 1.15rem;
    }

    .dialog-title {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .dialog-path {
      display: block;

    .dialog-actions {

      flex-shrink: 0;

    .code-view {

      overflow: auto;

    }

    .code-lines {
      min-width: min-content;

      font-size: 0.79rem;

    }

    .code-line {
      display: flex;
      gap: 18px;
      padding: 0 18px;

    }

    .code-line:hover {
      background: rgba(127, 127, 127, 0.06);
    }

    .code-line.is-focus {
      background: var(--accent-dim);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .line-no {

    .diff-add .line-text {

    }

    .diff-del {
      background: rgba(248, 81, 73, 0.1);

    .diff-del .line-text {

    .code-note {
      padding: 40px;

      font-size: 0.87rem;

    }

    .split {
      display: grid;

    .split-pane {
      overflow: auto;

    }

    .split-pane:last-child {

    .split-title {
      position: sticky;

      padding: 9px 16px;

      font-size: 0.7rem;
      color: var(--text-dim);
      background: var(--panel-solid);
      border-bottom: 1px solid var(--stroke);
    }

    .split-row {
      display: flex;
      gap: 14px;
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.6;
      white-space: pre;
    }

    .split-row.changed-before {
      background: rgba(248, 81, 73, 0.1);
    }

    .split-row.changed-after {
      background: rgba(63, 185, 80, 0.1);
    }

    .split-row.omitted {
      display: block;
      padding: 6px 16px;
      white-space: normal;
      color: var(--text-dim);
      background: rgba(127, 127, 127, 0.05);
      border-block: 1px solid var(--stroke);
    }

    .split-no {
      flex-shrink: 0;
      width: 42px;
      text-align: right;
      color: var(--text-dim);
      user-select: none;
    }

    .rail {
      margin-top: 72px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 10px;
    }

    .stat {
      display: inline-flex;
      align-items: center;

      font-family: var(--mono);

    .stat i {

    }

    .note {
      position: relative;

      font-size: 0.7rem;

    footer {

      border-top: 1px solid var(--stroke);

    .footer-row {
      display: flex;

    .footer-link:hover {

    }

    .footer-fine {
      margin-top: 14px;
      font-family: var(--mono);

      color: var(--text-dim);

    .footer-fine a {

    .toastify {
      padding: 12px 18px !important;
      border-radius: 11px !important;
      font-family: var(--font) !important;
      font-size: 0.85rem !important;
      color: var(--text) !important;
      background: var(--panel-solid) !important;
      border: 1px solid var(--stroke-strong) !important;
      box-shadow: var(--shadow-lg) !important;
    }

    @media (max-width: 720px) {
      main {
        padding: 0 16px 72px;
      }

      .float-tools {
        top: 14px;
        right: 14px;

      .hero {
        padding: 64px 0 40px;
      }

      .row {
        flex-wrap: wrap;
        padding: 14px 12px;
      }

      .row-main {
        flex-basis: calc(100% - 50px);
      }

      .row-meta {
        order: 3;
        margin-left: 50px;
      }

      .row-actions {
        order: 4;
        margin-left: auto;
      }

      .row-arrow {
        order: 5;
      }

      .section-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .revision {
        flex-direction: column;
        align-items: flex-start;
      }

      .revision-actions {
        width: 100%;
      }

      .revision-actions .btn {
        flex: 1;
      }

      .dialog {
        height: 88vh;
      }

      .split {
        grid-template-columns: 1fr;
      }

      .search-hit-line {
        max-width: 200px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }

      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <div class="backdrop">
    <div class="backdrop-grid"></div>
  </div>
  <div id="root"></div>
  <script type="module">
    import React, { useCallback, useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    const REPO = 'NtReadVirtualMemory/Roblox-Offsets-Website';
    const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/main`;

    const FILES = [
      { path: 'offsets.hpp', title: 'offsets.hpp', icon: 'ph-file-cpp', desc: 'C++ header file format (legacy)' },
      { path: 'ExternalStructs.hpp', title: 'ExternalStructs.hpp', icon: 'ph-brackets-square', desc: 'External structs header for seamless integration' },
      { path: 'offsets.json', title: 'offsets.json', icon: 'ph-brackets-curly', desc: 'JSON format for universal compatibility' },
      { path: 'FFlags.hpp', title: 'FFlags.hpp', icon: 'ph-flag', desc: 'FastFlag addresses for engine config and feature toggles' },
      { path: 'version', title: 'version', icon: 'ph-tag', desc: 'Check current version and track updates' },
      { path: 'internal-offsets.hpp', title: 'internal-offsets.hpp', icon: 'ph-lock-key', desc: 'Internal game offsets for advanced integration' }
    ];

    const HISTORY_FILES = [
      'offsets.hpp', 'ExternalStructs.hpp', 'FFlags.hpp', 'FFlags.json',
      'internal-offsets.hpp', 'offsets.json', 'version'
    ];

    const WALLETS = [
      { label: 'Bitcoin', icon: 'ph-currency-btc', color: '#f7931a', address: 'bc1qdmhhlr8k4wak73vx0tf9xd3jux79su2s6yfgks' },
      { label: 'Litecoin', icon: 'ph-currency-circle-dollar', color: '#a6a9aa', address: 'LT6pHQ2puuS7t32SXAFr11rnZv6KnuDikz' },
      { label: 'Solana', icon: 'ph-circles-three', color: '#9945ff', address: '8VKHFgpLj8UWNCsEXYVf7LxosLfAV24CQK5ibHfVE8QE' },
      { label: 'Ethereum', icon: 'ph-diamond', color: '#627eea', address: '0xb542810eECE9cE8AD8D9852065B3769Bf2DEA5c1' }
    ];

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return 'unknown size';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'unknown date';
      return new Intl.DateTimeFormat(undefined, {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      }).format(date);
    }

    function formatRelative(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'recently';
      const seconds = Math.round((date.getTime() - Date.now()) / 1000);
      const formatter = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
      const ranges = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60]];
      for (const [unit, amount] of ranges) {
        if (Math.abs(seconds) >= amount) return formatter.format(Math.round(seconds / amount), unit);
      }
      return formatter.format(seconds, 'second');
    }

    function toast(icon, message) {
      const node = document.createElement('div');
      node.style.cssText = 'display:flex;align-items:center;gap:10px';
      const glyph = document.createElement('i');
      glyph.className = `ph ${icon}`;
      glyph.style.cssText = 'font-size:1.1rem;color:var(--accent-soft)';
      const text = document.createElement('span');
      text.textContent = message;
      node.append(glyph, text);
      Toastify({ node, duration: 2600, gravity: 'bottom', position: 'right', close: false }).showToast();
    }

    async function getJSON(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    async function fetchMethods() {
      try {
        const data = await getJSON('/api/methods', { cache: 'no-store' });
        if (!Array.isArray(data.methods)) throw new Error('Malformed response');
        return data.methods;
      } catch {
        const data = await getJSON(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, {
          headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
        });
        if (!Array.isArray(data.tree)) throw new Error('Malformed tree');
        return data.tree
          .filter(entry => entry.type === 'blob' && entry.path.startsWith('Methods/'))
          .map(entry => {
            const encoded = entry.path.split('/').map(encodeURIComponent).join('/');
            return {
              name: entry.path.split('/').pop(),
              path: entry.path,
              size: entry.size ?? null,
              url: `${RAW_BASE}/${encoded}`,
              rawUrl: `${RAW_BASE}/${encoded}`,
              githubUrl: `https://github.com/${REPO}/blob/main/${encoded}`
            };
          })
          .sort((a, b) => a.path.localeCompare(b.path));
      }
    }

    async function fetchSource(target) {
      for (const candidate of [...new Set([target.url, target.rawUrl].filter(Boolean))]) {
        try {
          const response = await fetch(candidate, { cache: 'no-store' });
          if (response.ok) return response.text();
        } catch { /* fall through to the next candidate */ }
      }
      throw new Error('Source unavailable');
    }

    function useTheme() {
      const [theme, setTheme] = useState(() => document.documentElement.dataset.theme || 'dark');
      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('offsets-theme', theme); } catch { /* storage unavailable */ }
      }, [theme]);
      return [theme, () => setTheme(current => (current === 'light' ? 'dark' : 'light'))];
    }

    function useManifest() {
      const [manifest, setManifest] = useState(null);
      const [failed, setFailed] = useState(false);
      useEffect(() => {
        getJSON('/api/files')
          .then(data => {
            if (!Array.isArray(data.files)) throw new Error('Malformed manifest');
            setManifest(data);
          })
          .catch(() => setFailed(true));
      }, []);
      return { manifest, failed };
    }

    function Spinner({ label }) {
      return html`<div className="state"><i className="ph ph-spinner-gap spin"></i> ${label}</div>`;
    }

    const EDGE_FALLOFF = 120;

    function useEdgeGlow() {
      const onMouseMove = useCallback(event => {
        const element = event.currentTarget;
        const bounds = element.getBoundingClientRect();
        const x = event.clientX - bounds.left;
        const y = event.clientY - bounds.top;
        const horizontal = Math.min(EDGE_FALLOFF, bounds.width / 2);
        const vertical = Math.min(EDGE_FALLOFF, bounds.height / 2);
        const intensity = (distance, falloff) => Math.max(0, 1 - distance / falloff).toFixed(3);

        element.style.setProperty('--edge-left', intensity(x, horizontal));
        element.style.setProperty('--edge-right', intensity(bounds.width - x, horizontal));
        element.style.setProperty('--edge-top', intensity(y, vertical));
        element.style.setProperty('--edge-bottom', intensity(bounds.height - y, vertical));
        element.style.setProperty('--edge-x', `${x}px`);
        element.style.setProperty('--edge-y', `${y}px`);
      }, []);

      const onMouseLeave = useCallback(event => {
        for (const edge of ['left', 'right', 'top', 'bottom']) {
          event.currentTarget.style.setProperty(`--edge-${edge}`, '0');
        }
      }, []);

      return { onMouseMove, onMouseLeave };
    }

    function FloatingTools({ theme, onToggleTheme }) {
      return html`
    <div className="float-tools">
      <button
        className="icon-btn"
        type="button"
        onClick=${onToggleTheme}
        title=${theme === 'light' ? 'Dark theme' : 'Light theme'}
        aria-label=${theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'}
      >
        <i className=${`ph ${theme === 'light' ? 'ph-moon' : 'ph-sun'}`}></i>
      </button>
    </div>
  `;
    }

    function Hero({ manifest, failed }) {
      return html`
    <div className="hero">
      <!--
      <span className="pill"><span className="pulse"></span> Live & continuously updated</span> -->
      <h1><em>Offsets</em> API</h1>
      <p>Access game offsets, structs and FastFlags through lightning-fast endpoints that track every upstream release.</p>
      <div className="hero-meta">
        ${manifest && html`
          <span key="updated" title=${formatDate(manifest.updatedAt)}>
            <i className="ph ph-clock-counter-clockwise"></i> updated ${formatRelative(manifest.updatedAt)}
          </span>
          <a key="commit" href=${manifest.commitUrl} target="_blank" rel="noopener">commit ${manifest.shortHead}</a>
        `}
        ${!manifest && html`<span><i className="ph ph-clock-counter-clockwise"></i> ${failed ? 'latest update unavailable' : 'checking latest update...'}</span>`}
      </div>
    </div>
  `;
    }

    const MAX_HITS = 30;

    function Search({ manifest, failed, onOpen }) {
      const [query, setQuery] = useState('');
      const [matches, setMatches] = useState(null);
      const [status, setStatus] = useState('idle');
      const [dismissed, setDismissed] = useState(false);
      const indexRef = useRef(null);
      const boxRef = useRef(null);

      useEffect(() => {
        const onPointerDown = event => { if (!boxRef.current?.contains(event.target)) setDismissed(true); };
        const onKeyDown = event => { if (event.key === 'Escape') setDismissed(true); };
        document.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('keydown', onKeyDown);
        return () => {
          document.removeEventListener('pointerdown', onPointerDown);
          document.removeEventListener('keydown', onKeyDown);
        };
      }, []);

      const buildIndex = useCallback(async () => {
        if (indexRef.current) return indexRef.current;
        const searchable = (manifest?.files ?? []).filter(file =>
          Number.isFinite(file.size) && file.size <= 1500000 &&
          /\.(?:cpp|hpp|json|md|txt)$|^version$/i.test(file.path)
        );
        const settled = await Promise.allSettled(searchable.map(async file => {
          const response = await fetch(file.url);
          if (!response.ok) throw new Error('Unreachable file');
          const lines = (await response.text()).replace(/\r\n/g, '\n').split('\n');
          return { file, lines, lowerLines: lines.map(line => line.toLowerCase()) };
        }));
        indexRef.current = settled.filter(result => result.status === 'fulfilled').map(result => result.value);
        return indexRef.current;
      }, [manifest]);

      useEffect(() => {
        const trimmed = query.trim();
        setDismissed(false);
        if (!trimmed) {
          setMatches(null);
          setStatus('idle');
          return;
        }
        setStatus('searching');
        let cancelled = false;
        const timer = setTimeout(async () => {
          const needle = trimmed.toLowerCase();
          try {
            const index = await buildIndex();
            if (cancelled) return;
            const found = [];
            for (const entry of index) {
              if (found.length >= MAX_HITS) break;
              if (entry.file.path.toLowerCase().includes(needle)) {
                found.push({ entry, lineNumber: null, preview: 'Filename match' });
              }
              for (let line = 0; line < entry.lowerLines.length && found.length < MAX_HITS; line++) {
                if (entry.lowerLines[line].includes(needle)) {
                  found.push({ entry, lineNumber: line + 1, preview: entry.lines[line].trim() || '(empty line)' });
                }
              }
            }
            setMatches(found);
            setStatus('done');
          } catch {
            if (!cancelled) setStatus('error');
          }
        }, 220);
        return () => { cancelled = true; clearTimeout(timer); };
      }, [query, buildIndex]);

      const indexLabel = manifest ? `${manifest.count} files indexed` : failed ? 'index unavailable' : 'loading index';

      return html`
    <div className="searchbar" ref=${boxRef}>
      <div className="searchbar-field">
        <i className="ph ph-magnifying-glass"></i>
        <input
          type="search"
          autoComplete="off"
          spellCheck="false"
          placeholder="Search files, offsets and methods..."
          value=${query}
          onChange=${event => setQuery(event.target.value)}
          onFocus=${() => setDismissed(false)}
        />
        <span className="search-count">${indexLabel}</span>
      </div>
      ${query.trim() && !dismissed && html`
        <div className="search-panel">
          ${status === 'searching' && html`<div className="search-note">Searching source files...</div>`}
          ${status === 'error' && html`<div className="search-note">Search is temporarily unavailable.</div>`}
          ${status === 'done' && matches.length === 0 && html`<div className="search-note">No matching files or source lines.</div>`}
          ${status === 'done' && matches.map((match, position) => html`
            <button
              className="search-hit"
              type="button"
              key=${`${match.entry.file.path}:${match.lineNumber ?? 'file'}:${position}`}
              onClick=${() => onOpen({
        kind: 'source',
        ...match.entry.file,
        name: match.entry.file.path.split('/').pop(),
        focusLine: match.lineNumber
      })}
            >
              <span>
                <span className="search-hit-path">${match.entry.file.path}</span>
                <span className="search-hit-line">${match.preview}</span>
              </span>
              <span className="search-hit-badge">${match.lineNumber ? `line ${match.lineNumber}` : 'file'}</span>
            </button>
          `)}
        </div>
      `}
    </div>
  `;
    }

    function FileRow({ file, meta, failed }) {
      const glow = useEdgeGlow();
      const label = meta
        ? `${formatBytes(meta.size)} · sha256 ${meta.sha256 ? meta.sha256.slice(0, 8) : 'unavailable'}`
        : failed ? 'metadata unavailable' : 'loading metadata...';

      return html`
    <a className="row" href=${`/${file.path}`} ...${glow}>
      <span className="row-glyph"><i className=${`ph ${file.icon}`}></i></span>
      <span className="row-main">
        <span className="row-name">${file.title}</span>
        <span className="row-desc">${file.desc}</span>
      </span>
      <span className="row-meta" title=${meta?.sha256 ? `SHA-256: ${meta.sha256}` : undefined}>${label}</span>
      <i className="ph ph-arrow-up-right row-arrow"></i>
    </a>
  `;
    }

    function MethodRow({ method, onOpen }) {
      const glow = useEdgeGlow();

      return html`
    <article className="row" ...${glow}>
      <span className="row-glyph"><i className="ph ph-file-cpp"></i></span>
      <span className="row-main">
        <span className="row-name">${method.name}</span>
        <span className="row-desc">${method.path} · ${formatBytes(method.size)}</span>
      </span>
      <span className="row-actions">
        <button className="btn" type="button" onClick=${() => onOpen({ kind: 'source', ...method })}>
          <i className="ph ph-code"></i> View source
        </button>
        <a className="btn" href=${method.githubUrl} target="_blank" rel="noopener" aria-label="Open on GitHub">
          <i className="ph ph-github-logo"></i>
        </a>
      </span>
    </article>
  `;
    }

    function Methods({ onOpen }) {
      const [methods, setMethods] = useState(null);
      const [failed, setFailed] = useState(false);

      useEffect(() => {
        fetchMethods().then(setMethods).catch(() => setFailed(true));
      }, []);

      return html`
    <section id="methods">
      <div className="section-head">
        <div>
          <h2>Methods</h2>
          <p>Browse implementation examples and inspect the source without leaving the page.</p>
        </div>
        <div className="section-head-aside">
          <span className="tag">${methods ? `${methods.length} ${methods.length === 1 ? 'file' : 'files'}` : failed ? 'unavailable' : 'loading'}</span>
          <a className="btn" href=${`https://github.com/${REPO}/tree/main/Methods`} target="_blank" rel="noopener">
            <i className="ph ph-github-logo"></i> Browse on GitHub
          </a>
        </div>
      </div>
      ${failed && html`<div className="state">Methods are temporarily unavailable.</div>`}
      ${!failed && !methods && html`<${Spinner} label="Loading methods..." />`}
      ${methods && methods.length === 0 && html`<div className="state">No methods are currently available.</div>`}
      ${methods && methods.length > 0 && html`
        <div className="rows">
          ${methods.map(method => html`<${MethodRow} key=${method.path} method=${method} onOpen=${onOpen} />`)}
        </div>
      `}
    </section>
  `;
    }

    function History({ onOpen }) {
      const [path, setPath] = useState(HISTORY_FILES[0]);
      const [commits, setCommits] = useState(null);
      const [failed, setFailed] = useState(false);
      const [expanded, setExpanded] = useState(false);

      useEffect(() => {
        let cancelled = false;
        setCommits(null);
        setFailed(false);
        setExpanded(false);
        getJSON(`/api/history?path=${encodeURIComponent(path)}`)
          .then(data => {
            if (cancelled) return;
            if (!Array.isArray(data.commits)) throw new Error('Malformed history');
            setCommits(data.commits);
          })
          .catch(() => { if (!cancelled) setFailed(true); });
        return () => { cancelled = true; };
      }, [path]);

      const visible = commits ? (expanded ? commits : commits.slice(0, 5)) : [];

      return html`
    <section id="history">
      <div className="section-head">
        <div>
          <h2>Version history</h2>
          <p>Open an older revision or compare exactly what changed between updates.</p>
        </div>
        <select className="select" value=${path} onChange=${event => setPath(event.target.value)} aria-label="File version history">
          ${HISTORY_FILES.map(file => html`<option key=${file} value=${file}>${file}</option>`)}
        </select>
      </div>
      ${failed && html`<div className="state">Version history is temporarily unavailable.</div>`}
      ${!failed && !commits && html`<${Spinner} label="Loading version history..." />`}
      ${commits && commits.length === 0 && html`<div className="state">No earlier versions were found.</div>`}
      ${commits && commits.length > 0 && html`
        <div className="stack">
          ${visible.map((commit, index) => html`
            <article className="revision" key=${commit.sha}>
              <div className="revision-body">
                <div className="revision-msg" title=${commit.message}>${commit.message}</div>
                <div className="revision-meta">
                  <a href=${commit.githubUrl} target="_blank" rel="noopener">${commit.shortSha}</a>
                  <span>${formatDate(commit.committedAt)}</span>
                  <span>${commit.author}</span>
                </div>
              </div>
              <div className="revision-actions">
                <button
                  className="btn"
                  type="button"
                  onClick=${() => onOpen({
        kind: 'source',
        name: path.split('/').pop(),
        path: `${path} @ ${commit.shortSha}`,
        url: `/api/file?path=${encodeURIComponent(path)}&ref=${commit.sha}`
      })}
                >
                  <i className="ph ph-eye"></i> View
                </button>
                ${commits[index + 1] && html`
                  <button
                    className="btn"
                    type="button"
                    title=${`Compare ${commits[index + 1].shortSha} → ${commit.shortSha}`}
                    onClick=${() => onOpen({ kind: 'diff', path, base: commits[index + 1].sha, head: commit.sha })}
                  >
                    <i className="ph ph-git-diff"></i> Compare
                  </button>
                `}
              </div>
            </article>
          `)}
          ${!expanded && commits.length > visible.length && html`
            <button className="btn" type="button" onClick=${() => setExpanded(true)}>
              Show ${commits.length - visible.length} older versions
            </button>
          `}
        </div>
      `}
    </section>
  `;
    }

    function buildSplitRows(beforeText, afterText) {
      const before = beforeText.replace(/\r\n/g, '\n').split('\n');
      const after = afterText.replace(/\r\n/g, '\n').split('\n');
      const total = Math.max(before.length, after.length);
      const visible = new Set();
      for (let index = 0; index < total; index++) {
        if (before[index] !== after[index]) {
          for (let near = Math.max(0, index - 2); near <= Math.min(total - 1, index + 2); near++) visible.add(near);
        }
      }

      const rows = [];
      let previous = -1;
      for (const index of [...visible].sort((a, b) => a - b)) {
        if (previous !== -1 && index > previous + 1) rows.push({ omitted: index - previous - 1 });
        rows.push({ index, before: before[index], after: after[index], changed: before[index] !== after[index] });
        previous = index;
      }
      return rows;
    }

    function CodeLines({ source, mode, focusLine }) {
      const lines = useMemo(() => source.replace(/\r\n/g, '\n').split('\n'), [source]);
      const focusRef = useRef(null);

      useEffect(() => {
        if (focusRef.current) focusRef.current.scrollIntoView({ block: 'center' });
      }, [source, focusLine]);

      return html`
    <div className="code-lines">
      ${lines.map((content, index) => {
        const number = index + 1;
        let modifier = '';
        if (mode === 'diff') {
          if (content.startsWith('+') && !content.startsWith('+++')) modifier = ' diff-add';
          else if (content.startsWith('-') && !content.startsWith('---')) modifier = ' diff-del';
          else if (content.startsWith('@@')) modifier = ' diff-hunk';
        }
        const focused = focusLine === number;
        return html`
          <div className=${`code-line${modifier}${focused ? ' is-focus' : ''}`} key=${number} ref=${focused ? focusRef : null}>
            <span className="line-no">${number}</span>
            <span className="line-text">${content || ' '}</span>
          </div>
        `;
      })}
    </div>
  `;
    }

    function SplitDiff({ rows, base, head }) {
      const pane = (title, side) => html`
    <div className="split-pane">
      <div className="split-title">${title}</div>
      ${rows.map((row, index) => row.omitted !== undefined
        ? html`<div className="split-row omitted" key=${`gap-${index}`}>⋯ ${row.omitted.toLocaleString()} unchanged lines</div>`
        : html`
          <div className=${`split-row${row.changed ? ` changed-${side}` : ''}`} key=${`${side}-${row.index}`}>
            <span className="split-no">${row[side] === undefined ? '' : row.index + 1}</span>
            <span>${row[side] ?? ' '}</span>
          </div>
        `)}
    </div>
  `;
      return html`<div className="split">${pane(`before · ${base.slice(0, 7)}`, 'before')}${pane(`after · ${head.slice(0, 7)}`, 'after')}</div>`;
    }

    function Viewer({ request, onClose }) {
      const [view, setView] = useState({ status: 'loading' });

      useEffect(() => {
        let cancelled = false;
        setView({ status: 'loading' });

        (async () => {
          if (request.kind === 'diff') {
            const diff = await getJSON(`/api/diff?path=${encodeURIComponent(request.path)}&base=${request.base}&head=${request.head}`);
            if (diff.patch) return { status: 'ready', mode: 'diff', source: diff.patch, rawUrl: diff.githubUrl, diff };
            if (diff.truncated && diff.beforeUrl && diff.afterUrl) {
              const [before, after] = await Promise.all([fetch(diff.beforeUrl), fetch(diff.afterUrl)]);
              if (!before.ok || !after.ok) throw new Error('Revision unavailable');
              const rows = buildSplitRows(await before.text(), await after.text());
              if (rows.length === 0) return { status: 'empty', message: 'No line-level changes found.', rawUrl: diff.githubUrl, diff };
              return { status: 'ready', mode: 'split', rows, rawUrl: diff.githubUrl, diff };
            }
            return { status: 'empty', message: 'No changes in this file.', rawUrl: diff.githubUrl, diff };
          }
          return { status: 'ready', mode: 'code', source: await fetchSource(request), rawUrl: request.rawUrl || request.url };
        })()
          .then(next => { if (!cancelled) setView(next); })
          .catch(() => {
            if (!cancelled) {
              setView({
                status: 'error',
                message: request.kind === 'diff' ? 'Unable to load this comparison.' : 'Unable to load this source file.'
              });
            }
          });

        return () => { cancelled = true; };
      }, [request]);

      useEffect(() => {
        const onKeyDown = event => { if (event.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKeyDown);
        const previousOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKeyDown);
          document.body.style.overflow = previousOverflow;
        };
      }, [onClose]);

      const isDiff = request.kind === 'diff';
      const title = isDiff ? `${request.path} diff` : request.name;
      const subtitle = isDiff
        ? `${request.base.slice(0, 7)} → ${request.head.slice(0, 7)}${view.diff ? ` · +${view.diff.additions} −${view.diff.deletions}` : ''}`
        : request.path;

      const copy = async () => {
        if (!view.source) return;
        try {
          await navigator.clipboard.writeText(view.source);
          toast('ph-check-circle', 'Source copied to clipboard');
        } catch {
          toast('ph-x-circle', 'Failed to copy');
        }
      };

      return html`
    <div className="overlay" onMouseDown=${event => { if (event.target === event.currentTarget) onClose(); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-label=${title}>
        <div className="dialog-head">
          <div className="dialog-file">
            <i className=${`ph ${isDiff ? 'ph-git-diff' : 'ph-file-cpp'}`}></i>
            <div style=${{ minWidth: 0 }}>
              <span className="dialog-title">${title}</span>
              <span className="dialog-path">${subtitle}</span>
            </div>
          </div>
          <div className="dialog-actions">
            <button className="btn" type="button" disabled=${!view.source} onClick=${copy}>
              <i className="ph ph-copy"></i> Copy
            </button>
            ${view.rawUrl && html`
              <a className="btn" href=${view.rawUrl} target="_blank" rel="noopener"><i className="ph ph-arrow-square-out"></i> Raw</a>
            `}
            <button className="btn" type="button" onClick=${onClose} aria-label="Close source viewer" autoFocus><i className="ph ph-x"></i></button>
          </div>
        </div>
        <div className="code-view">
          ${view.status === 'loading' && html`<div className="code-note"><i className="ph ph-spinner-gap spin"></i> Loading ${isDiff ? 'comparison' : 'source'}...</div>`}
          ${(view.status === 'error' || view.status === 'empty') && html`<div className="code-note">${view.message}</div>`}
          ${view.status === 'ready' && view.mode === 'split' && html`<${SplitDiff} rows=${view.rows} base=${request.base} head=${request.head} />`}
          ${view.status === 'ready' && view.mode !== 'split' && html`
            <${CodeLines} source=${view.source} mode=${view.mode} focusLine=${request.focusLine ?? null} />
          `}
        </div>
      </div>
    </div>
  `;
    }

    function StatsRail() {
      const [version, setVersion] = useState(null);
      const [stats, setStats] = useState(null);
      const [noteOpen, setNoteOpen] = useState(false);

      useEffect(() => {
        fetch('/version')
          .then(response => (response.ok ? response.text() : Promise.reject(new Error('No version'))))
          .then(text => setVersion(text.trim()))
          .catch(() => setVersion(''));

        getJSON('/api/stats', { cache: 'no-store' })
          .then(data => {
            if (!Number.isFinite(data.visits) || !Number.isFinite(data.lifetimeVisits)) throw new Error('Malformed stats');
            setStats(data);
          })
          .catch(() => setStats({}));
      }, []);

      return html`
    <div>
      <div className="rail">
        <span className="stat"><i className="ph ph-git-commit"></i>${version === null ? 'loading version...' : version || 'version unavailable'}</span>
        <span className="stat" title="Page views during the rolling 24-hour window">
          <i className="ph ph-chart-line-up"></i>
          ${stats === null ? 'loading visits...' : Number.isFinite(stats.visits) ? `${stats.visits.toLocaleString()} visits · last 24h` : '24h stats unavailable'}
        </span>
        <span className="stat" title="Page views since lifetime tracking was enabled">
          <i className="ph ph-infinity"></i>
          ${stats === null ? 'loading lifetime...' : Number.isFinite(stats.lifetimeVisits) ? `${stats.lifetimeVisits.toLocaleString()} visits · lifetime` : 'lifetime unavailable'}
        </span>
        <button
          className="icon-btn"
          type="button"
          onClick=${() => setNoteOpen(open => !open)}
          aria-expanded=${noteOpen}
          aria-label="How visit counting protects privacy"
        >
          <i className="ph ph-info"></i>
        </button>
      </div>
      ${noteOpen && html`
        <div className="rail">
          <p className="note">
            The counter stores anonymous page-view totals only. No IP addresses, cookies, device IDs or other personal data are saved.
          </p>
        </div>
      `}
    </div>
  `;
    }

    function Support() {
      const [open, setOpen] = useState(false);

      const copyAddress = async address => {
        try {
          await navigator.clipboard.writeText(address);
          toast('ph-check-circle', 'Address copied to clipboard');
        } catch {
          toast('ph-x-circle', 'Failed to copy');
        }
      };

      return html`
    <div className="support">
      <button className="btn btn-primary" type="button" onClick=${() => setOpen(value => !value)}>
        <i className=${`ph ${open ? 'ph-x' : 'ph-heart'}`}></i> ${open ? 'Close' : 'Support the project'}
      </button>
      ${open && html`
        <div className="wallets">
          ${WALLETS.map(wallet => html`
            <div className="wallet" key=${wallet.label}>
              <div className="wallet-head">
                <i className=${`ph ${wallet.icon}`} style=${{ color: wallet.color }}></i> ${wallet.label}
              </div>
              <div className="wallet-address">${wallet.address}</div>
              <button className="btn btn-full" type="button" onClick=${() => copyAddress(wallet.address)}>
                <i className="ph ph-copy"></i> Copy address
              </button>
            </div>
          `)}
        </div>
      `}
    </div>
  `;
    }

    function Footer() {
      return html`
    <footer>
      <div className="footer-row">
        <a className="footer-link" href="https://discord.gg/mvyXmWVkya" target="_blank" rel="noopener">
          <i className="ph ph-discord-logo"></i> discord.gg/mvyXmWVkya
        </a>
        <a className="footer-link" href=${`https://github.com/${REPO}`} target="_blank" rel="noopener">
          <i className="ph ph-github-logo"></i> Source code
        </a>
        <a className="footer-link" href="/api/files" target="_blank" rel="noopener">
          <i className="ph ph-list-dashes"></i> File manifest
        </a>
      </div>
      <div className="footer-fine">
        Designed by <a href="https://discord.com/users/936249234510979183" target="_blank" rel="noopener">@hbyq</a> & <a href="https://discord.com/users/1398787323864289382" target="_blank" rel="noopener">@ammytundra_</a> · © 2026 0x108. All rights reserved.
      </div>
    </footer>
  `;
    }

    function App() {
      const [theme, toggleTheme] = useTheme();
      const { manifest, failed } = useManifest();
      const [request, setRequest] = useState(null);
      const triggerRef = useRef(null);

      const openViewer = useCallback(target => {
        triggerRef.current = document.activeElement;
        setRequest(target);
      }, []);

      const closeViewer = useCallback(() => {
        setRequest(null);
        triggerRef.current?.focus?.();
      }, []);

      const metaByPath = useMemo(() => {
        const table = new Map();
        for (const file of manifest?.files ?? []) table.set(file.path, file);
        return table;
      }, [manifest]);

      return html`
    <div className="shell">
      <${FloatingTools} theme=${theme} onToggleTheme=${toggleTheme} />
      <main>
        <${Hero} manifest=${manifest} failed=${failed} />
        <${Search} manifest=${manifest} failed=${failed} onOpen=${openViewer} />
        <section>
          <div className="section-head">
            <div>
              <h2>Endpoints</h2>
              <p>Every artifact is regenerated on each upstream release and served straight from the edge.</p>
            </div>
          </div>
          <div className="rows">
            ${FILES.map(file => html`
              <${FileRow} key=${file.path} file=${file} meta=${metaByPath.get(file.path)} failed=${failed} />
            `)}
          </div>
        </section>
        <${Methods} onOpen=${openViewer} />
        <${History} onOpen=${openViewer} />
        <${StatsRail} />
        <${Support} />
      </main>
      <${Footer} />
      ${request && html`<${Viewer} request=${request} onClose=${closeViewer} />`}
    </div>
  `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>

</html>
